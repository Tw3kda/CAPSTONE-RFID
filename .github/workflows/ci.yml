name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: thesora_test
          POSTGRES_USER: thesora
          POSTGRES_PASSWORD: ci-isolated-postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U thesora -d thesora_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_DB: thesora_test
      POSTGRES_USER: thesora
      POSTGRES_PASSWORD: ci-isolated-postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check app migrations tests
      - run: python -m ruff format --check app migrations tests
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest -q -s

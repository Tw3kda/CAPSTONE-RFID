openapi: 3.1.0
info:
  title: Thesora API
  version: 1.0.0
  description: Contrato HTTP para la aplicación React y los dispositivos ESP32.
servers:
  - url: https://thesora.redskycol.com/api
security:
  - bearerAuth: []
tags:
  - name: Infraestructura
  - name: Autenticación
  - name: Inventario
  - name: Préstamos
  - name: Análisis
  - name: Administración
  - name: Dispositivos

paths:
  /health/live:
    get:
      tags: [Infraestructura]
      summary: Comprobar que el proceso de la API responde
      security: []
      responses:
        '200':
          description: Proceso disponible
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: ok}
  /health/ready:
    get:
      tags: [Infraestructura]
      summary: Comprobar disponibilidad de API y conexión PostgreSQL
      security: []
      responses:
        '200':
          description: API y base de datos disponibles
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                properties:
                  status: {type: string, const: ok}
                  database: {type: string, const: ok}
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail: {type: string, const: Database unavailable}
  /auth/login:
    post:
      tags: [Autenticación]
      summary: Identificar usuario por credencial QR o ID institucional
      description: El método id exige ID institucional registrado y clave de 12 a 128 caracteres sin recortar espacios. El método qr no acepta clave y exige un carné asociado explícitamente a una cuenta activa. El formato QR completo es E000000000 + ID numérico de longitud variable + exactamente seis hexadecimales finales. Se valida el ID contra el registro independiente y se compara el HMAC canónico sin sufijo. El sufijo puede variar; no se acepta la parte canónica sola ni un UID RFID de equipo. No se habilita QR por el mero hecho de tener ID. Los roles provienen del servidor. Los hashes completos legados solo admiten su QR exacto hasta reasociación explícita. No hay Microsoft ni segundo factor; una copia del carné permite suplantación (limitación aceptada).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metodo, credencial]
              properties:
                metodo: {type: string, enum: [qr, id]}
                credencial: {type: string, minLength: 1, maxLength: 256}
                clave: {type: string, format: password, writeOnly: true, minLength: 1, maxLength: 128, description: 'Verifica la clave existente sin imponer la longitud mínima de altas o restablecimientos; no recorta espacios.'}
              additionalProperties: false
              allOf:
                - if:
                    properties: {metodo: {const: id}}
                  then:
                    required: [clave]
                - if:
                    properties: {metodo: {const: qr}}
                  then:
                    not: {required: [clave]}
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sesion'}
        '401': {$ref: '#/components/responses/NoAutorizado'}
        '422': {description: Solicitud inválida o factores incompatibles con el método; nunca incluye entradas sensibles.}
  /auth/refresh:
    post:
      tags: [Autenticación]
      summary: Renovar token de acceso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        '200':
          description: Tokens renovados
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tokens'}
        '401': {$ref: '#/components/responses/NoAutorizado'}
  /auth/me:
    get:
      tags: [Autenticación]
      summary: Consultar la cuenta actual
      responses:
        '200':
          description: Cuenta
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Usuario'}
        '401': {$ref: '#/components/responses/NoAutorizado'}

  /categorias:
    get:
      tags: [Inventario]
      summary: Listar categorías
      responses:
        '200':
          description: Categorías
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Categoria'}
    post:
      tags: [Administración]
      summary: Crear categoría (Administrador)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Nombre'}
      responses:
        '201': {description: Categoría creada}
        '403': {$ref: '#/components/responses/Prohibido'}
  /activos:
    get:
      tags: [Inventario]
      summary: Buscar activos
      parameters:
        - {name: q, in: query, schema: {type: string}, description: Nombre o código}
        - {name: categoria_id, in: query, schema: {type: integer}}
        - {name: estado, in: query, description: 'disponible excluye activos con ausencia física confirmada.', schema: {type: string, enum: [disponible, prestado, en_revision]}}
      responses:
        '200':
          description: Activos encontrados
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Activo'}
    post:
      tags: [Administración]
      summary: Crear activo (Administrador)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivoEdicion'}
      responses:
        '201':
          description: Activo creado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activo'}
        '403': {$ref: '#/components/responses/Prohibido'}
  /activos/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Inventario]
      summary: Consultar ficha, disponibilidad y ubicación del activo
      description: Usar disponible para habilitar préstamos; estado conserva el estado de negocio y presente informa la evidencia RFID independiente.
      responses:
        '200':
          description: Activo
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activo'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
    patch:
      tags: [Administración]
      summary: Editar activo (Administrador)
      description: Actualización parcial; los campos omitidos se conservan. No requiere reenviar el RFID y este no se expone en las lecturas del inventario. Para cambiarlo se proporciona el nuevo UID. No se puede alterar identidad física, posición ni estado durante un préstamo abierto. condicion y ultima_revision_at admiten null para borrar; los demás campos no admiten null.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivoParcial'}
      responses:
        '200':
          description: Activo actualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activo'}
        '403': {$ref: '#/components/responses/Prohibido'}
  /activos/{id}/ubicacion:
    get:
      tags: [Inventario]
      summary: Obtener el estante y la posición señalada para el mapa
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Posición asignada y posiciones vecinas del mismo estante
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UbicacionMapa'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
  /activos/{id}/senal:
    post:
      tags: [Inventario]
      summary: Solicitar iluminación temporal del LED de la posición asignada
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '202': {description: Señal programada para el siguiente sondeo del ESP32}
        '409': {$ref: '#/components/responses/Conflicto'}
  /activos/{id}/historial:
    get:
      tags: [Inventario]
      summary: Consultar movimientos RFID e historial del activo
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Historial
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Movimiento'}

  /prestamos:
    get:
      tags: [Préstamos]
      summary: Listar préstamos propios o todos según permisos
      parameters:
        - {name: alcance, in: query, schema: {type: string, enum: [mios, todos], default: mios}}
        - {name: estado, in: query, schema: {type: string}}
      responses:
        '200':
          description: Préstamos
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Prestamo'}
    post:
      tags: [Préstamos]
      summary: Preparar retiro; el RFID confirma la salida física
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activo_id, responsable_id, devolucion_esperada_at]
              properties:
                activo_id: {type: integer}
                responsable_id: {type: integer, description: Debe ser el usuario actual salvo rol Encargado o Administrador.}
                devolucion_esperada_at: {type: string, format: date-time}
      responses:
        '201':
          description: Préstamo pendiente de detección física
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Prestamo'}
        '409': {$ref: '#/components/responses/Conflicto'}
  /prestamos/{id}:
    get:
      tags: [Préstamos]
      summary: Ver detalle del préstamo
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Préstamo
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Prestamo'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
  /prestamos/{id}/devolucion:
    post:
      tags: [Préstamos]
      summary: Iniciar verificación RFID para devolución
      description: No cierra el préstamo. La detección del UID correcto y de la posición asignada determina su cierre.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '202':
          description: En espera de identidad y posición RFID
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Prestamo'}
        '409': {$ref: '#/components/responses/Conflicto'}
  /prestamos/{id}/cancelar-operacion:
    post:
      tags: [Préstamos]
      summary: Cancelar espera de retiro o de devolución
      description: Si el préstamo ya estaba activo, vuelve al estado activo; no se cancela el préstamo en curso.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Operación cancelada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Prestamo'}
        '409': {$ref: '#/components/responses/Conflicto'}

  /analisis/resumen:
    get:
      tags: [Análisis]
      summary: Resumen de uso por período, disponibilidad y recursos subutilizados
      description: Solo Administrador; Usuario y Encargado reciben 403. Ventana móvil de 90 días en UTC. Uso semanal cuenta retiros físicos confirmados (retiro_at), agrupados por lunes; incluye semanas sin movimientos. Baja utilización identifica activos disponibles sin retiros en esa ventana, sin contar preparaciones/cancelaciones.
      responses:
        '401': {$ref: '#/components/responses/NoAutorizado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '200':
          description: Indicadores
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResumenAnalisis'}
  /analisis/reutilizables:
    get:
      tags: [Análisis]
      summary: Activos que conviene revisar antes de adquirir otros
      description: Solo Administrador; Usuario y Encargado reciben 403. Activos disponibles sin retiro físico confirmado en los últimos 90 días. La ausencia de historial no demuestra desuso.
      responses:
        '401': {$ref: '#/components/responses/NoAutorizado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '200':
          description: Activos de baja utilización
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Activo'}
  /analisis/recomendacion:
    post:
      tags: [Análisis]
      summary: Obtener recomendación contextual de reutilización y mantenimiento
      description: >-
        Solo Administrador; Usuario y Encargado reciben 403. Una llamada directa a OpenAI
        Responses API genera acciones priorizadas en español con evidencia numérica por
        recurso, sin limitarse a repetir indicadores. El backend selecciona hasta ocho
        recursos por uso confirmado, baja utilización o revisión; no exige ausencia de uso.
        Envía nombre, categoría, estado, disponibilidad, condición y última revisión junto
        a retiros agregados de 90 días y dos ventanas consecutivas de 30 días, y mediana,
        máximo y tamaño de muestra de duraciones de préstamos finalizados válidos de la
        cohorte de retiros de 90 días. Todo el historial se analiza con el mismo criterio;
        los marcadores internos de carga no se envían al modelo ni a la respuesta.
        Nunca envía usuarios, identificadores personales, préstamos
        individuales, plazos, RFID, posiciones ni credenciales; una duración larga no se
        presenta como retraso. La salida JSON conserva texto, activos_relacionados y
        datos_insuficientes. Los IDs deben ser un subconjunto único no vacío de los recursos
        enviados cuando los haya; la insuficiencia se calcula en backend. La validación de
        esquema no garantiza la veracidad de cada frase. Sin configuración o ante fallo no
        hay recomendación heurística. Ocultar/mostrar conserva la respuesta en cliente sin
        otra llamada; regenerar requiere otro POST explícito.
      responses:
        '401': {$ref: '#/components/responses/NoAutorizado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '200':
          description: Recomendación
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Recomendacion'}
        '502': {description: 'Respuesta del proveedor inválida, rechazada, incompleta o incompatible con los datos; no se devuelve recomendación.'}
        '503': {description: 'Proveedor sin configurar, timeout, límite de solicitudes o indisponibilidad temporal; no se devuelve recomendación.'}

  /usuarios:
    get:
      tags: [Administración]
      summary: Buscar personas para préstamo delegado (Encargado o Administrador)
      description: Busca parcialmente por nombre o por coincidencia exacta del QR o ID institucional registrado (HMAC). No devuelve esos identificadores ni permite búsqueda parcial de ellos. El id numérico de la respuesta es interno, no el ID institucional.
      parameters:
        - {name: q, in: query, schema: {type: string}}
      responses:
        '200':
          description: Usuarios
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Usuario'}
        '403': {$ref: '#/components/responses/Prohibido'}
    post:
      tags: [Administración]
      summary: Crear usuario (Administrador)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, rol, identificador_institucional, clave]
              properties:
                nombre: {type: string}
                correo: {type: string, format: email}
                rol: {$ref: '#/components/schemas/Rol'}
                credencial: {type: [string, 'null'], minLength: 1, maxLength: 256, description: 'QR completo opcional E000000000+ID numérico registrado+seis hexadecimales; se guarda solo el HMAC canónico y no se devuelve.'}
                identificador_institucional: {type: string, minLength: 1, maxLength: 256, description: 'ID institucional obligatorio registrado por el administrador; se guarda solo su HMAC. Debe ser numérico para asociar un carné.'}
                clave: {type: string, format: password, writeOnly: true, minLength: 12, maxLength: 128, description: 'Obligatoria en altas; preserva espacios y nunca se devuelve.'}
      responses:
        '201': {description: Usuario creado}
        '409': {$ref: '#/components/responses/Conflicto'}
        '422': {description: Campos inválidos o carné incompatible con el ID registrado; sin entradas sensibles.}
        '403': {$ref: '#/components/responses/Prohibido'}
  /usuarios/{id}:
    patch:
      tags: [Administración]
      summary: Actualizar cuenta o rol (Administrador)
      parameters:
        - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: {type: string}
                rol: {$ref: '#/components/schemas/Rol'}
                activo: {type: boolean}
                identificador_institucional: {type: string, minLength: 1, maxLength: 256, description: Omitir conserva el ID; un valor válido lo reemplaza; null o vacío son rechazados. Nunca se devuelve el valor registrado.}
                credencial: {type: [string, 'null'], minLength: 1, maxLength: 256, description: 'Omitir conserva el carné; un QR completo del ID registrado lo reasocia canónicamente; null lo retira. Vacío o un QR ajeno se rechazan. Cambiar el ID también reasocia un carné existente al nuevo ID numérico.'}
                clave: {type: string, format: password, writeOnly: true, minLength: 12, maxLength: 128, description: 'Omitir conserva la clave; un valor la restablece. Null o vacío se rechazan. Nunca se devuelve.'}
      responses:
        '200': {description: Usuario actualizado}
        '409': {$ref: '#/components/responses/Conflicto'}
        '422': {description: Campos inválidos o carné incompatible con el ID registrado; sin entradas sensibles.}
        '403': {$ref: '#/components/responses/Prohibido'}
  /posiciones:
    get:
      tags: [Inventario]
      summary: Listar posiciones físicas
      responses:
        '200':
          description: Posiciones
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Ubicacion'}
    post:
      tags: [Administración]
      summary: Crear posición dentro de un gabinete (Administrador)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gabinete_id, estante, codigo]
              properties:
                gabinete_id: {type: integer}
                estante: {type: string}
                codigo: {type: string}
      responses:
        '201': {description: Posición creada}
        '403': {$ref: '#/components/responses/Prohibido'}
  /lectores:
    get:
      tags: [Administración]
      summary: Listar lectores registrados (Administrador)
      responses:
        '200':
          description: Lectores y posiciones asignadas
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Lector'}
        '401': {$ref: '#/components/responses/NoAutorizado'}
        '403': {$ref: '#/components/responses/Prohibido'}
    post:
      tags: [Administración]
      summary: Registrar lector de un ESP32 en una posición (Administrador)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dispositivo_id, canal, posicion_id]
              properties:
                dispositivo_id: {type: string}
                canal: {type: integer, minimum: 1}
                posicion_id: {type: integer}
      responses:
        '201': {description: Lector registrado}
        '403': {$ref: '#/components/responses/Prohibido'}
  /lectores/{id}:
    patch:
      tags: [Administración]
      summary: Cambiar posición de un lector (Administrador)
      parameters:
        - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [posicion_id]
              properties:
                posicion_id: {type: integer}
      responses:
        '200': {description: Posición actualizada; el ESP32 obtendrá el nuevo mapeo}
        '403': {$ref: '#/components/responses/Prohibido'}

  /espacios:
    get:
      tags: [Administración]
      summary: Listar espacios físicos (Administrador)
      responses:
        '200':
          description: Espacios registrados
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Espacio'}
        '401': {$ref: '#/components/responses/NoAutorizado'}
        '403': {$ref: '#/components/responses/Prohibido'}
    post:
      tags: [Administración]
      summary: Crear espacio físico (Administrador)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre: {type: string, minLength: 1, maxLength: 120}
      responses:
        '201':
          description: Espacio creado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Espacio'}
        '403': {$ref: '#/components/responses/Prohibido'}
  /gabinetes:
    get:
      tags: [Administración]
      summary: Listar gabinetes y su espacio (Administrador)
      responses:
        '200':
          description: Gabinetes registrados
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Gabinete'}
        '401': {$ref: '#/components/responses/NoAutorizado'}
        '403': {$ref: '#/components/responses/Prohibido'}
    post:
      tags: [Administración]
      summary: Crear gabinete dentro de un espacio (Administrador)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, espacio_id]
              properties:
                nombre: {type: string, minLength: 1, maxLength: 120}
                espacio_id: {type: integer, minimum: 1}
      responses:
        '201':
          description: Gabinete creado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Gabinete'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
  /dispositivos:
    get:
      tags: [Administración]
      summary: Listar dispositivos y último heartbeat (Administrador)
      description: No devuelve claves ni hashes de autenticación. No infiere un estado conectado/desconectado sin un umbral documentado.
      responses:
        '200':
          description: Dispositivos registrados
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Dispositivo'}
        '401': {$ref: '#/components/responses/NoAutorizado'}
        '403': {$ref: '#/components/responses/Prohibido'}
    post:
      tags: [Administración]
      summary: Registrar ESP32 y emitir credencial propia (Administrador)
      description: La clave aleatoria se entrega solo en esta respuesta; se almacena su hash SHA-256. No existe credencial compartida entre dispositivos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}
      responses:
        '201':
          description: Dispositivo registrado; guardar clave en el ESP32
          content:
            application/json:
              schema:
                type: object
                required: [id, api_key]
                properties:
                  id: {type: string}
                  api_key: {type: string}
        '403': {$ref: '#/components/responses/Prohibido'}
        '409': {$ref: '#/components/responses/Conflicto'}
  /dispositivos/{dispositivo_id}/configuracion:
    get:
      tags: [Dispositivos]
      summary: Obtener mapeo vigente de RFID a lectores físicos
      description: Autoridad en backend; el ESP32 conserva copia en flash para uso sin conexión.
      security: [{deviceKey: []}]
      parameters:
        - {$ref: '#/components/parameters/DispositivoId'}
      responses:
        '200':
          description: Mapeo
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Mapeo'}
        '401': {$ref: '#/components/responses/NoAutorizado'}
  /dispositivos/{dispositivo_id}/senales:
    get:
      tags: [Dispositivos]
      summary: Consultar qué LED debe encenderse
      description: El parpadeo por RFID incorrecto se decide localmente en el ESP32.
      security: [{deviceKey: []}]
      parameters:
        - {$ref: '#/components/parameters/DispositivoId'}
      responses:
        '200':
          description: Canales a iluminar
          content:
            application/json:
              schema:
                type: object
                required: [canales]
                properties:
                  canales:
                    type: array
                    items: {type: integer, minimum: 1}
  /dispositivos/{dispositivo_id}/eventos:
    post:
      tags: [Dispositivos]
      summary: Ingresar lote de lecturas RFID
      description: 'Transacción atómica; deduplicación por (dispositivo_id, arranque, secuencia). PRESENTE del arranque es inventario inicial, no una devolución. El backend valida préstamos y posiciones. Las observaciones actualizan presencia física independientemente de los préstamos; las antiguas se registran sin revertir evidencia más reciente. Un retiro sin préstamo nunca crea uno ni marca mantenimiento.'
      security: [{deviceKey: []}]
      parameters:
        - {$ref: '#/components/parameters/DispositivoId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arranque, eventos]
              properties:
                arranque: {type: integer, minimum: 0}
                eventos:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items: {$ref: '#/components/schemas/EventoDispositivo'}
      responses:
        '202':
          description: Lote confirmado; los duplicados no generan movimientos nuevos
          content:
            application/json:
              schema:
                type: object
                required: [aceptados, duplicados]
                properties:
                  aceptados: {type: integer}
                  duplicados: {type: integer}
        '422': {$ref: '#/components/responses/Validacion'}
  /dispositivos/{dispositivo_id}/heartbeat:
    post:
      tags: [Dispositivos]
      summary: Registrar latido y versión del ESP32
      security: [{deviceKey: []}]
      parameters:
        - {$ref: '#/components/parameters/DispositivoId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arranque, firmware]
              properties:
                arranque: {type: integer}
                firmware: {type: string}
                rssi: {type: integer}
      responses:
        '204': {description: Estado actualizado}

  /ws/estado:
    get:
      tags: [Préstamos]
      summary: Cambios de inventario y de préstamo en vivo (WebSocket)
      description: 'Handshake WebSocket. Evento JSON: {tipo, activo_id, prestamo_id, estado, detalle}. El cliente usa su sesión autenticada; no se incluyen tokens en la URL. inventario_actualizado usa prestamo_id y estado null; ante retiro correcto sin préstamo incluye detalle {error: retiro_sin_prestamo, presente: false}; reposición incluye {presente: true}. No incluye UID ni datos personales. Los reintentos deduplicados no vuelven a notificar.'
      responses:
        '101': {description: Switching Protocols}
        '401': {$ref: '#/components/responses/NoAutorizado'}
      x-websocket: true

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    deviceKey:
      type: apiKey
      in: header
      name: X-Device-Key
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    DispositivoId:
      name: dispositivo_id
      in: path
      required: true
      schema: {type: string}
  responses:
    NoEncontrado:
      description: Registro no encontrado
    NoAutorizado:
      description: Sesión o credencial inválida
    Prohibido:
      description: Rol sin permisos
    Conflicto:
      description: Estado incompatible con la operación
    Validacion:
      description: Lote o datos inválidos; no se procesan eventos del lote
  schemas:
    Rol:
      type: string
      enum: [usuario, encargado, administrador]
    Nombre:
      type: object
      required: [nombre]
      properties:
        nombre: {type: string, minLength: 1}
    Categoria:
      type: object
      required: [id, nombre]
      properties:
        id: {type: integer}
        nombre: {type: string}
    Espacio:
      type: object
      required: [id, nombre]
      properties:
        id: {type: integer}
        nombre: {type: string}
    Gabinete:
      allOf:
        - {$ref: '#/components/schemas/Espacio'}
        - type: object
          required: [espacio_id]
          properties:
            espacio_id: {type: integer}
    Usuario:
      type: object
      required: [id, nombre, rol, activo]
      properties:
        id: {type: integer}
        nombre: {type: string}
        rol: {$ref: '#/components/schemas/Rol'}
        activo: {type: boolean}
    Tokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        token_type: {type: string, const: bearer}
        expires_in: {type: integer, description: Segundos de vigencia del acceso}
    Sesion:
      type: object
      required: [tokens, usuario]
      properties:
        tokens: {$ref: '#/components/schemas/Tokens'}
        usuario: {$ref: '#/components/schemas/Usuario'}
    Ubicacion:
      type: object
      required: [posicion_id, espacio, gabinete, estante, codigo]
      properties:
        posicion_id: {type: integer}
        espacio: {type: string}
        gabinete: {type: string}
        estante: {type: string}
        codigo: {type: string}
    UbicacionMapa:
      type: object
      required: [asignada, posiciones_estante]
      properties:
        asignada: {$ref: '#/components/schemas/Ubicacion'}
        posiciones_estante:
          type: array
          items: {$ref: '#/components/schemas/Ubicacion'}
    Activo:
      type: object
      required: [id, nombre, codigo, categoria, categoria_id, estado, presente, disponible, ubicacion]
      properties:
        id: {type: integer}
        nombre: {type: string}
        codigo: {type: string, description: 'Código público calculado del ID, por ejemplo ACT-004'}
        categoria: {type: string}
        categoria_id: {type: integer, description: Referencia para edición administrativa; el UID RFID no se expone en esta respuesta.}
        estado: {type: string, enum: [disponible, prestado, en_revision]}
        presente: {type: [boolean, 'null'], description: 'Última observación física en la posición asignada; null significa sin evidencia válida. No cierra préstamos.'}
        disponible: {type: boolean, description: 'Estado de negocio disponible y presente distinto de false. Ausente bloquea nuevos préstamos aunque estado conserve disponible.'}
        condicion: {type: [string, 'null'], description: Descripción de la condición física}
        ultima_revision_at: {type: [string, 'null'], format: date-time}
        ubicacion: {$ref: '#/components/schemas/Ubicacion'}
    ActivoEdicion:
      type: object
      required: [nombre, categoria_id, posicion_asignada_id, rfid_uid]
      properties:
        nombre: {type: string}
        categoria_id: {type: integer}
        posicion_asignada_id: {type: integer}
        rfid_uid: {type: string, pattern: '^[0-9A-Fa-f]{8,20}$'}
        estado: {type: string, enum: [disponible, prestado, en_revision]}
        condicion: {type: string}
        ultima_revision_at: {type: [string, 'null'], format: date-time}
    ActivoParcial:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nombre: {type: string, minLength: 1, maxLength: 150}
        categoria_id: {type: integer, minimum: 1}
        posicion_asignada_id: {type: integer, minimum: 1}
        rfid_uid: {type: string, pattern: '^[0-9A-Fa-f]{8,20}$'}
        estado: {type: string, enum: [disponible, prestado, en_revision]}
        condicion: {type: [string, 'null'], maxLength: 100}
        ultima_revision_at: {type: [string, 'null'], format: date-time}
    Lector:
      type: object
      required: [id, dispositivo_id, canal, posicion_id]
      properties:
        id: {type: integer}
        dispositivo_id: {type: string}
        canal: {type: integer, minimum: 1}
        posicion_id: {type: integer}
    Dispositivo:
      type: object
      additionalProperties: false
      required: [id, firmware, ultimo_heartbeat, ultimo_rssi]
      properties:
        id: {type: string}
        firmware: {type: [string, 'null']}
        ultimo_heartbeat: {type: [string, 'null'], format: date-time}
        ultimo_rssi: {type: [integer, 'null']}
    Prestamo:
      type: object
      required: [id, activo_id, responsable_id, entregado_por_id, devolucion_esperada_at, estado]
      properties:
        id: {type: integer}
        activo_id: {type: integer}
        responsable_id: {type: integer}
        entregado_por_id: {type: integer}
        activo_nombre: {type: string}
        responsable_nombre: {type: string}
        entregado_por_nombre: {type: string}
        ubicacion_asignada: {$ref: '#/components/schemas/Ubicacion'}
        retiro_at: {type: [string, 'null'], format: date-time}
        devolucion_esperada_at: {type: string, format: date-time}
        devolucion_at: {type: [string, 'null'], format: date-time}
        estado:
          type: string
          enum: [pendiente_retiro, activo, validando_devolucion, esperando_posicion, devuelto, cancelado]
    Movimiento:
      type: object
      required: [id, tipo, ocurrido_at]
      properties:
        id: {type: integer}
        tipo: {type: string}
        ocurrido_at: {type: string, format: date-time}
        prestamo_id: {type: [integer, 'null']}
        ubicacion: {$ref: '#/components/schemas/Ubicacion'}
    ResumenAnalisis:
      type: object
      required: [disponibles, prestados, en_revision, uso_semanal, baja_utilizacion]
      properties:
        disponibles: {type: integer}
        prestados: {type: integer}
        en_revision: {type: integer}
        uso_semanal:
          type: array
          items:
            type: object
            required: [semana, movimientos]
            properties:
              semana: {type: string}
              movimientos: {type: integer}
        baja_utilizacion:
          type: array
          items: {type: integer, description: ID de activo}
    Recomendacion:
      type: object
      required: [texto, activos_relacionados]
      properties:
        texto: {type: string}
        activos_relacionados:
          type: array
          items: {type: integer}
        datos_insuficientes: {type: boolean}
    Mapeo:
      type: object
      required: [uid, activo_id, codigo, canal]
      properties:
        uid: {type: string, description: UID hexadecimal de la etiqueta}
        activo_id: {type: integer}
        codigo: {type: string}
        canal: {type: integer, minimum: 1}
    EventoDispositivo:
      type: object
      required: [secuencia, tipo, antiguedad_ms]
      properties:
        secuencia: {type: integer, minimum: 1}
        tipo: {type: string, enum: [INICIO, PRESENTE, DEVUELTO, RETIRADO]}
        canal: {type: [integer, 'null'], minimum: 1, description: Nulo solo en INICIO}
        uid: {type: [string, 'null'], description: Nulo solo en INICIO}
        antiguedad_ms: {type: integer, minimum: 0, description: Tiempo transcurrido desde la observación en el ESP32}
